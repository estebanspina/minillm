name: Pruebas educativas
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar NumPy
        run: python -m pip install -r 01-red-neuronal/requirements.txt
      - name: Probar laboratorio 00
        working-directory: 00-bigramas
        run: python -m unittest discover -p 'test_*.py'
      - name: Probar laboratorio 01
        working-directory: 01-red-neuronal
        run: python -m unittest discover -p 'test_*.py'
      - name: Entrenamiento mínimo
        working-directory: 01-red-neuronal
        run: |
          python minillm.py entrenar --pasos 10
          python minillm.py generar --inicio 'el ' --longitud 20
